<div class="sidenav" [ngClass]="collapsed() ? 'sidenav-collapsed' : ''">
  <div class="logo-container">
    @if (!collapsed()) {
      <div class="logo-text">MARKR</div>
    } @else {
      <div class="logo-text" style="font-size: 18px;">M</div>
    }
  </div>
  <ul class="sidenav-nav">
    @for (data of navData; track data) {
      <li class="sidenav-nav-item" >
        <a class="sidenav-nav-link" [routerLink]="[data.routerLink]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}">
          <i class="sidenav-link-icon" [classList]="data.icon"></i>
          @if (!collapsed()) {
            <span class="sidenav-link-text">{{data.label}}</span>
          }
        </a>
      </li>
    }
  </ul>

  <div class="sidenav-footer">
    <button class="toggle-btn" (click)="toogleCollapse()">
      <i class="fa" [ngClass]="collapsed() ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
    </button>
  </div>
</div>
